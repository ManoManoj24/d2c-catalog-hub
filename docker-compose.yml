services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pim
      POSTGRES_PASSWORD: pim
      POSTGRES_DB: pim
    ports:
      - "5432:5432"
    volumes:
      - pim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pim -d pim"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pim_pg:
